# ── JDK 要求（Android Studio 同步前务必确认）────────────────────────
# 本项目编译目标为 JDK 17（见 app/build.gradle.kts 的 compileOptions/jvmTarget）。
# Android Studio 的「Gradle JDK」请选 JDK 17 或 JDK 21，**不要用自带的 JBR 25**：
# Gradle 8.9 官方仅支持 Java 8~22，JDK 25 会导致项目同步/依赖解析失败。
# 本机可用路径：
#   C:\Program Files\Eclipse Adoptium\jdk-17.0.20.101-hotspot
#   C:\Program Files\Eclipse Adoptium\jdk-21.0.12.101-hotspot
# 另外「Gradle 用户主目录」保持 C:\Users\<你>\.gradle 不要改——
# wrapper 下载的 gradle-8.9 已缓存在该目录下，改了会重新联网下载（国内直连
# services.gradle.org 会 SSL 失败，需换腾讯云镜像手动放置）。

android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.parallel=true
org.gradle.caching=true
# 中文路径/中文资源必须显式指定 UTF-8，否则 Windows 下会按 GBK 读源码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

kotlin.code.style=official

# 并行同步：Gradle 9.4+ 才识别该属性，本仓库锁 8.9（此行为升级预留，当前不生效）
org.gradle.tooling.parallel=true
